<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>siymon | المحفظة</title>
<script src="/theme-boot.js?v=1"></script>
<meta name="theme-color" content="#0F0F0F" />
<link rel="stylesheet" href="/brand.css" />
<link rel="stylesheet" href="/wallet/wallet.css?v=3" />
</head>
<body>
<div class="w-wrap">
  <header class="w-head">
    <a class="w-back" id="wBack" href="/" aria-label="back">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 id="wTitle">المحفظة</h1>
    <div class="w-lang" role="group" aria-label="language">
      <button type="button" data-lang="ar">ع</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="w-main">
    <!-- not signed in -->
    <section id="wAuth" class="w-card w-auth hidden" aria-live="polite"></section>

    <!-- ============ wallet home ============ -->
    <div id="wHome">
      <section class="w-hero" id="wHero">
        <div class="w-hero-top">
          <span class="w-hero-label" id="wBalLabel">الرصيد المتاح</span>
          <button class="w-eye" id="wEye" type="button" aria-pressed="false" title="إظهار/إخفاء">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="w-bal-row">
          <b class="w-bal" id="wBal">—</b>
          <span class="w-cur" id="wCur">MAD</span>
        </div>
        <p class="w-hero-note" id="wBalNote"></p>
        <div class="w-hero-actions">
          <button class="w-btn" id="wTopBtn" type="button">شحن المحفظة</button>
          <button class="w-btn ghost" id="wHistBtn" type="button">السجل</button>
        </div>
      </section>

      <section class="w-stats" id="wStats" aria-live="polite"></section>

      <section class="w-card w-loyalty" id="wLoyalty" aria-live="polite"></section>

      <section class="w-card w-terms" id="wTermsBox">
        <button class="w-terms-head" id="wTermsBtn" type="button" aria-expanded="false">
          <span id="wTermsTitle">شروط الاستخدام</span><span class="w-chev" aria-hidden="true">⌄</span>
        </button>
        <div class="w-terms-body hidden" id="wTerms"></div>
      </section>
    </div>

    <!-- ============ top-up ============ -->
    <section class="w-panel hidden" id="wTopPanel" aria-labelledby="wTopTitle">
      <div class="w-panel-head">
        <button class="w-close" type="button" data-back aria-label="back">‹</button>
        <h2 id="wTopTitle">شحن المحفظة</h2>
      </div>
      <p class="w-lead" id="wTopLead"></p>

      <div class="w-methods" id="wMethods" role="radiogroup" aria-label="payment methods"></div>
      <div class="w-info hidden" id="wMethodInfo"></div>

      <label class="w-label" id="wAmountLabel" for="wAmount">المبلغ</label>
      <div class="w-chips" id="wPresets"></div>
      <div class="w-input-row">
        <input id="wAmount" type="number" inputmode="decimal" step="0.01" min="1" placeholder="0.00" dir="ltr" />
        <span class="w-input-cur">MAD</span>
      </div>
      <p class="w-hint" id="wLimits"></p>
      <div class="w-quote hidden" id="wQuote" aria-live="polite"></div>

      <label class="w-label" id="wRefLabel" for="wRef">مرجع التحويل</label>
      <input id="wRef" class="w-input" type="text" maxlength="60" autocomplete="off" dir="ltr" />
      <label class="w-label" id="wRcptLabel" for="wRcpt">صورة الوصل</label>
      <input id="wRcpt" class="w-input w-file" type="file" accept="image/*" />
      <p class="w-hint" id="wFine"></p>

      <div class="w-msg" id="wMsg" role="alert"></div>
      <div class="w-retry hidden" id="wRetry">
        <button class="w-btn" type="button" id="wRetryBtn">إعادة المحاولة</button>
        <button class="w-btn ghost" type="button" id="wOtherBtn">اختيار طريقة أخرى</button>
      </div>
      <button class="w-btn w-submit" id="wSend" type="button">تأكيد الطلب</button>
    </section>

    <!-- ============ history ============ -->
    <section class="w-panel hidden" id="wHistPanel" aria-labelledby="wHistTitle">
      <div class="w-panel-head">
        <button class="w-close" type="button" data-back aria-label="back">‹</button>
        <h2 id="wHistTitle">السجل</h2>
      </div>
      <div class="w-filters" id="wFilters" role="tablist" aria-label="filters"></div>
      <div class="w-hist" id="wHist" aria-live="polite"></div>
    </section>
  </main>
</div>
<script src="/wallet/wallet.js?v=3"></script>
</body>
</html>
